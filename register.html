<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Register</title>
    <style>
      body {
        font-family: system-ui;
        padding: 16px;
        width: 360px;
      }
      label {
        display: block;
        margin-top: 8px;
      }
      input {
        width: 100%;
        padding: 8px;
        margin-top: 4px;
      }
      button {
        margin-top: 12px;
        padding: 8px 12px;
      }
    </style>
  </head>
  <body>
    <h2>Register</h2>
    <form id="registerForm">
      <label>Full name<input id="name" type="text" required /></label>
      <label>Email address<input id="email" type="email" required /></label>
      <label
        >Password<input id="password" type="password" required minlength="6"
      /></label>
      <div style="margin-top: 10px">
        <button type="submit">Register</button>
        <button id="to-login" type="button">Go to Login</button>
      </div>
    </form>

    <script src="register.js"></script>
  </body>
</html>
