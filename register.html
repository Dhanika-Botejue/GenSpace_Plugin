<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Register — GenSpace</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <div class="card" role="dialog" aria-labelledby="register-title">
      <div class="brand">
        <div class="logo">GS</div>
        <div>
          <h1 id="register-title">Create your GenSpace account</h1>
          <p class="subtitle">
            Save and share interesting pages. Quick, private demo auth.
          </p>
        </div>
      </div>

      <form id="registerForm" autocomplete="on">
        <div class="field">
          <label for="name">Full name</label>
          <input
            id="name"
            name="name"
            type="text"
            required
            placeholder="Jane Doe"
          />
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            required
            placeholder="you@company.com"
          />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            required
            minlength="6"
            placeholder="Choose a secure password"
          />
        </div>

        <div class="actions">
          <button class="btn btn-primary" type="submit">Create account</button>
          <button id="to-login" class="btn btn-ghost" type="button">
            Sign in
          </button>
        </div>
      </form>

      <p class="note">
        By creating an account you agree to the demo terms. Passwords are stored
        locally in this demo.
      </p>
    </div>

    <script src="register.js"></script>
  </body>
</html>
