<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign in — GenSpace</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <div class="card" role="dialog" aria-labelledby="login-title">
      <div class="brand">
        <div class="logo">GS</div>
        <div>
          <h1 id="login-title">Sign in to GenSpace</h1>
          <p class="subtitle">Access your saved pages and share with others.</p>
        </div>
      </div>

      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            required
            placeholder="you@company.com"
          />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            required
            placeholder="Your password"
          />
        </div>

        <div class="actions">
          <button class="btn btn-primary" type="submit">Sign in</button>
          <button id="to-register" class="btn btn-ghost" type="button">
            Create account
          </button>
        </div>
      </form>

      <p class="note">
        This is a demo auth. For production, use a secure server-side auth flow.
      </p>
    </div>

    <script src="login.js"></script>
  </body>
</html>
