<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
        <style>
      :root {
        --card: #fff;
        --muted: #6b7280;
        --accent: #2563eb;
        --danger: #ef4444;
        --bg: #f5f7fb;
      }
      body {
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
        padding: 0;
        margin: 0;
        width: 360px;
        background: linear-gradient(180deg, #f8fafc, #f1f5f9);
        color: #0f172a;
      }
      .container {
        padding: 16px;
      }
      .row {
        margin-bottom: 10px;
      }
      .card {
        background: var(--card);
        border-radius: 12px;
        padding: 20px 22px;
        box-shadow: 0 6px 20px rgba(2, 6, 23, 0.08);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      }
      .logo {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--accent), #7c3aed);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 18px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      p.subtitle {
        margin: 6px 0 18px;
        color: var(--muted);
        font-size: 13px;
      }
      .field {
        margin-bottom: 12px;
      }
      label {
        display: block;
        font-size: 13px;
        color: #111827;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #e6e9ef;
        background: #fff;
        font-size: 14px;
        box-sizing: border-box;
      }
      input:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        border-color: var(--accent);
      }
      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 14px;
      }
      .btn {
        padding: 10px 14px;
        border-radius: 8px;
        border: 0;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-ghost {
        background: transparent;
        border: 1px solid #e6e9ef;
        color: #111827;
      }
      .note {
        margin-top: 12px;
        font-size: 12px;
        color: var(--muted);
      }
      a {
        cursor: pointer;
        color: #0066cc;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="main-view" class="container">
      <div id="not-logged-in" style="display: none">
        <div class="card">
          <div class="brand">
            <div>
              <h1>Welcome to GenSpace</h1>
              <p class="subtitle">Save and share interesting pages.</p>
            </div>
          </div>
          
          <p style="font-size: 14px; margin-bottom: 20px; color: var(--muted);">
            You must be logged in to save pages.
          </p>

          <div class="actions" style="flex-direction: column; align-items: stretch;">
            <button id="show-login" class="btn btn-primary">Sign in</button>
            <button id="show-register" class="btn btn-ghost">Create account</button>
          </div>
        </div>
      </div>

      <div id="logged-in" style="display: none">
        <div class="card">
          <div class="brand">
            <div>
              <h1>GenSpace</h1>
              <p class="subtitle">Ready to save.</p>
            </div>
          </div>

          <div style="background: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #e6e9ef;">
            <div style="font-size: 14px; font-weight: 600; color: #0f172a;" id="user-name"></div>
            <div style="font-size: 13px; color: var(--muted);" id="user-email"></div>
          </div>

          <div class="actions" style="flex-direction: column; align-items: stretch;">
            <button id="save" class="btn btn-primary">Save Page HTML</button>
            <button id="logout" class="btn btn-ghost" style="color: var(--danger); border-color: #fee2e2; background: #fef2f2;">Logout</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Inline Login form -->
    <div id="login-view" style="display: none" class="container">
      <div class="card" role="dialog" aria-labelledby="login-title">
        <div class="brand">
          <div>
            <h1 id="login-title">Sign in to GenSpace</h1>
            <p class="subtitle">Access your saved pages and share with others.</p>
          </div>
        </div>

        <form id="loginForm" autocomplete="on">
          <div class="field">
            <label for="login-email">Email address</label>
            <input
              id="login-email"
              name="email"
              type="email"
              required
              placeholder="you@company.com"
            />
          </div>

          <div class="field">
            <label for="login-password">Password</label>
            <input
              id="login-password"
              name="password"
              type="password"
              required
              placeholder="Your password"
            />
          </div>

          <div class="actions">
            <button class="btn btn-primary" type="submit">Sign in</button>
            <button id="login-to-register" class="btn btn-ghost" type="button">
              Create account
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Inline Register form -->
    <div id="register-view" style="display: none" class="container">
      <div class="card" role="dialog" aria-labelledby="register-title">
        <div class="brand">
          <div>
            <h1 id="register-title">Create your GenSpace account</h1>
            <p class="subtitle">
              Save and share interesting pages.
            </p>
          </div>
        </div>

        <form id="registerForm" autocomplete="on">
          <div class="field">
            <label for="register-name">Full name</label>
            <input
              id="register-name"
              name="name"
              type="text"
              required
              placeholder="Jane Doe"
            />
          </div>

          <div class="field">
            <label for="register-email">Email address</label>
            <input
              id="register-email"
              name="email"
              type="email"
              required
              placeholder="you@company.com"
            />
          </div>

          <div class="field">
            <label for="register-password">Password</label>
            <input
              id="register-password"
              name="password"
              type="password"
              required
              minlength="6"
              placeholder="Choose a secure password"
            />
          </div>

          <div class="actions">
            <button class="btn btn-primary" type="submit">Create account</button>
            <button id="register-to-login" class="btn btn-ghost" type="button">
              Sign in
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
