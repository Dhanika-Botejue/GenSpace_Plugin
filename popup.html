<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
        <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <div id="main-view" class="container">
      <div id="not-logged-in" style="display: none">
        <div class="card">
          <div class="brand">
            <div>
              <h1>Welcome to GenSpace</h1>
              <p class="subtitle">Save and share interesting pages.</p>
            </div>
          </div>
          
          <p style="font-size: 14px; margin-bottom: 20px; color: var(--muted);">
            You must be logged in to save pages.
          </p>

          <div class="actions" style="flex-direction: column; align-items: stretch;">
            <button id="show-login" class="btn btn-primary">Sign in</button>
            <button id="show-register" class="btn btn-ghost">Create account</button>
          </div>
        </div>
      </div>

      <div id="logged-in" style="display: none">
        <div class="card">
          <div class="brand">
            <div>
              <h1>GenSpace</h1>
              <p class="subtitle">Ready to save.</p>
            </div>
          </div>

          <div style="background: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #e6e9ef;">
            <div style="font-size: 14px; font-weight: 600; color: #0f172a;" id="user-name"></div>
            <div style="font-size: 13px; color: var(--muted);" id="user-email"></div>
          </div>

          <div class="actions" style="flex-direction: column; align-items: stretch;">
            <button id="save" class="btn btn-primary">Save Page HTML</button>
            <button id="logout" class="btn btn-ghost" style="color: var(--danger); border-color: #fee2e2; background: #fef2f2;">Logout</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Inline Login form -->
    <div id="login-view" style="display: none" class="container">
      <div class="card" role="dialog" aria-labelledby="login-title">
        <div class="brand">
          <div>
            <h1 id="login-title">Sign in to GenSpace</h1>
            <p class="subtitle">Access your saved pages and share with others.</p>
          </div>
        </div>

        <form id="loginForm" autocomplete="on">
          <div class="field">
            <label for="login-email">Email address</label>
            <input
              id="login-email"
              name="email"
              type="email"
              required
              placeholder="you@company.com"
            />
          </div>

          <div class="field">
            <label for="login-password">Password</label>
            <input
              id="login-password"
              name="password"
              type="password"
              required
              placeholder="Your password"
            />
          </div>

          <div class="actions">
            <button class="btn btn-primary" type="submit">Sign in</button>
            <button id="login-to-register" class="btn btn-ghost" type="button">
              Create account
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Inline Register form -->
    <div id="register-view" style="display: none" class="container">
      <div class="card" role="dialog" aria-labelledby="register-title">
        <div class="brand">
          <div>
            <h1 id="register-title">Create your GenSpace account</h1>
            <p class="subtitle">
              Save and share interesting pages.
            </p>
          </div>
        </div>

        <form id="registerForm" autocomplete="on">
          <div class="field">
            <label for="register-name">Full name</label>
            <input
              id="register-name"
              name="name"
              type="text"
              required
              placeholder="Jane Doe"
            />
          </div>

          <div class="field">
            <label for="register-email">Email address</label>
            <input
              id="register-email"
              name="email"
              type="email"
              required
              placeholder="you@company.com"
            />
          </div>

          <div class="field">
            <label for="register-password">Password</label>
            <input
              id="register-password"
              name="password"
              type="password"
              required
              minlength="6"
              placeholder="Choose a secure password"
            />
          </div>

          <div class="actions">
            <button class="btn btn-primary" type="submit">Create account</button>
            <button id="register-to-login" class="btn btn-ghost" type="button">
              Sign in
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
